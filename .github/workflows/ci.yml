name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  API_URL: http://localhost:8000
  GROQ_API_KEY: ci-placeholder
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  JWT_SECRET: ci-placeholder-jwt-secret
  ALLOWED_ORIGINS: http://localhost:3000

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter ./apps/web lint
      - run: pnpm --filter ./apps/web typecheck
      - run: pnpm --filter ./apps/web test
      - run: pnpm --filter ./apps/web build

  api:
    name: API (lint, typecheck, test, migrate)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rehearse_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Ruff check
        working-directory: apps/api
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Pyright
        working-directory: apps/api
        run: uv run pyright

      - name: Pytest
        working-directory: apps/api
        run: uv run pytest

      # DATABASE_URL here overrides the SQLite one set at workflow level (used by pytest) —
      # this is the one place the schema is proven against real MySQL 8, not just SQLite's
      # approximation of it.
      - name: Alembic upgrade head (MySQL)
        working-directory: apps/api
        env:
          DATABASE_URL: mysql+aiomysql://root:root@127.0.0.1:3306/rehearse_ci
        run: uv run alembic upgrade head
